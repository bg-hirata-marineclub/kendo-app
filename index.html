<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KendoTournamentConnect - Test & UI Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold mb-6 text-gray-800">GAS API 疎通テスト</h1>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">GAS Web App URL</label>
                    <input type="text" id="gasUrl" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 bg-gray-50 text-sm" 
                           placeholder="https://script.google.com/macros/s/.../exec">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="testSaveTournament()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">
                        1. 構造保存
                    </button>
                    <button onclick="testUpdateMatch()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">
                        2. 試合更新
                    </button>
                </div>
                <div>
                    <pre id="responseLog" class="mt-2 p-4 bg-black text-green-400 rounded-md overflow-x-auto min-h-[60px] text-xs font-mono">待機中...</pre>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">トーナメントUI プレビュー</h2>
            <p class="text-sm text-gray-500 mb-4">選手名をタップすると、赤い線がアニメーションで延びます。</p>
            
            <div class="bg-gray-50 p-4 rounded-lg overflow-x-auto border border-gray-200">
                <svg width="350" height="180" viewBox="0 0 350 180" class="mx-auto">
                    <g transform="translate(20, 30)">
                        <rect id="p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('p1')"/>
                        <text x="10" y="23" font-size="12" font-weight="bold" pointer-events="none">面田 (A高校)</text>
                        
                        <rect id="p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('p2')"/>
                        <text x="10" y="68" font-size="12" font-weight="bold" pointer-events="none">小手山 (B中学)</text>
                        
                        <path id="win_line" d="M 120 40 L 160 40 L 160 95 L 200 95" 
                              fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"
                              style="transition: stroke 0.4s, stroke-dashoffset 0.8s ease-in-out; stroke-dasharray: 200; stroke-dashoffset: 200;"/>
                    </g>

                    <g transform="translate(220, 75)">
                        <rect x="0" y="0" width="100" height="40" rx="5" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="4" />
                        <text x="50" y="25" font-size="10" fill="#9ca3af" text-anchor="middle">準決勝へ</text>
                    </g>
                </svg>
            </div>
            
            <button onclick="location.reload()" class="mt-4 text-xs text-gray-400 hover:underline">リセット（再読み込み）</button>
        </div>

    </div>

    <script>
        // API通信ロジック
        async function callGas(action, data) {
            const url = document.getElementById('gasUrl').value;
            const logElement = document.getElementById('responseLog');
            if (!url) { alert("GASのURLを入力してください！"); return; }
            logElement.innerText = "送信中...";
            try {
                const response = await fetch(url, { method: 'POST', body: JSON.stringify({ action, data }) });
                const result = await response.json();
                logElement.innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                logElement.innerText = "エラー:\n" + error;
            }
        }

        function testSaveTournament() {
            callGas('SAVE_TOURNAMENT', { tournament_id: "T1", matches: [{ id: "M1", player1: "面田", player2: "小手山", next_match_id: "M3" }] });
        }

        function testUpdateMatch() {
            callGas('UPDATE_MATCH', { id: "M1", score1: 2, score2: 0, winner_id: "面田" });
        }

        // UIアニメーションロジック
        function markWinner(pId) {
            const line = document.getElementById('win_line');
            const box1 = document.getElementById('p1_box');
            const box2 = document.getElementById('p2_box');

            // 枠の色をリセットしてから選択側をハイライト
            [box1, box2].forEach(box => {
                box.setAttribute('fill', 'white');
                box.setAttribute('stroke', '#d1d5db');
            });

            const selectedBox = document.getElementById(pId + '_box');
            selectedBox.setAttribute('fill', '#fef2f2'); // 薄い赤
            selectedBox.setAttribute('stroke', '#ef4444'); // 剣道の赤

            // 線のアニメーション
            line.style.stroke = "#ef4444";
            line.style.strokeDashoffset = "0"; // dasharrayと同じ値から0にすることで線が伸びる

            // スマホ振動（LIFF/Android対応）
            if (window.navigator.vibrate) window.navigator.vibrate(15);
        }

        /**
 * 団体戦の結果を計算するロジック
 * @param {Array} matches - 各ポジションの試合結果配列
 * @returns {Object} 集計結果と勝敗判定
 */
function calculateTeamWinner(matches) {
    let teamA = { wins: 0, points: 0 };
    let teamB = { wins: 0, points: 0 };

    matches.forEach(m => {
        // 本数の加算
        teamA.points += m.scoreA;
        teamB.points += m.scoreB;

        // 勝数の判定
        if (m.scoreA > m.scoreB) {
            teamA.wins += 1;
        } else if (m.scoreB > m.scoreA) {
            teamB.wins += 1;
        }
    });

    // 勝敗判定
    let result = "";
    let needsDaihyo = false; // 代表戦フラグ

    if (teamA.wins > teamB.wins) {
        result = "Team A 勝ち (勝数差)";
    } else if (teamB.wins > teamA.wins) {
        result = "Team B 勝ち (勝数差)";
    } else {
        // 勝数が同じなら本数勝負
        if (teamA.points > teamB.points) {
            result = "Team A 勝ち (本数差)";
        } else if (teamB.points > teamA.points) {
            result = "Team B 勝ち (本数差)";
        } else {
            result = "引き分け (代表戦が必要)";
            needsDaihyo = true;
        }
    }

    return { teamA, teamB, result, needsDaihyo };
}

// テスト用実行関数
function runLogicTest() {
    const dummyMatches = [
        { pos: "先鋒", scoreA: 2, scoreB: 0 }, // A二本勝ち
        { pos: "次鋒", scoreA: 0, scoreB: 1 }, // B一本勝ち
        { pos: "中堅", scoreA: 1, scoreB: 1 }, // 引き分け
        { pos: "副将", scoreA: 0, scoreB: 0 }, // 引き分け
        { pos: "大将", scoreA: 1, scoreB: 0 }  // A一本勝ち
    ];

    const summary = calculateTeamWinner(dummyMatches);
    console.log("集計結果:", summary);
    alert(`結果: ${summary.result}\nTeamA: ${summary.teamA.wins}勝(${summary.teamA.points}本)\nTeamB: ${summary.teamB.wins}勝(${summary.teamB.points}本)`);
}
    </script>
</body>
</html>
