<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KendoTournamentConnect - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold mb-6 text-gray-800">GAS API 連携テスト</h1>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="testSaveTournament()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">
                        1. 構造保存テスト
                    </button>
                    <button onclick="testUpdateMatch()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">
                        2. 試合更新テスト
                    </button>
                </div>
                <div class="mt-4">
                    <button onclick="runLogicTest()" class="w-full bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition text-sm font-bold shadow">
                        3. 団体戦の勝敗判定をテスト
                    </button>
                </div>
                <div>
                    <pre id="responseLog" class="mt-2 p-4 bg-black text-green-400 rounded-md overflow-x-auto min-h-[60px] text-xs font-mono">待機中...</pre>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-500">
            <h2 class="text-xl font-bold mb-4 text-gray-800">4. トーナメント表のAI解析（Gemini）</h2>
            <p class="text-sm text-gray-500 mb-4">画像をアップロードすると、AIが解析して下のUIを自動で書き換えます。</p>
            
            <div class="space-y-4">
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" onchange="previewImage(event)">
                
                <div id="imagePreviewContainer" class="hidden mt-4">
                    <img id="imagePreview" class="max-w-full h-auto rounded border border-gray-200" alt="プレビュー">
                </div>

                <button onclick="analyzeImage()" class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition text-sm font-bold shadow">
                    画像をGeminiで解析してUIに反映する
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-red-500">
            <h2 class="text-xl font-bold mb-2 text-gray-800">デジタル・トーナメント表</h2>
            <p id="tourney_name" class="text-sm font-bold text-red-600 mb-4">（未設定の大会）</p>
            <p class="text-xs text-gray-500 mb-4">選手名をタップすると、勝者が次の試合へ進みます。</p>
            
            <div class="bg-gray-50 p-4 rounded-lg overflow-x-auto border border-gray-200">
                <svg width="360" height="240" viewBox="0 0 360 240" class="mx-auto">
                    
                    <g transform="translate(20, 20)">
                        <rect id="m1_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('m1', 1)"/>
                        <text id="m1_p1_text" x="10" y="23" font-size="12" font-weight="bold" pointer-events="none">選手1</text>
                        
                        <rect id="m1_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('m1', 2)"/>
                        <text id="m1_p2_text" x="10" y="68" font-size="12" font-weight="bold" pointer-events="none">選手2</text>
                        
                        <path id="m1_win_line" d="M 120 40 L 160 40 L 160 72.5 L 200 72.5" 
                              fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"
                              style="transition: stroke 0.4s, stroke-dashoffset 0.8s ease-in-out; stroke-dasharray: 200; stroke-dashoffset: 200;"/>
                    </g>

                    <g transform="translate(20, 130)">
                        <rect id="m2_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('m2', 1)"/>
                        <text id="m2_p1_text" x="10" y="23" font-size="12" font-weight="bold" pointer-events="none">選手3</text>
                        
                        <rect id="m2_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="markWinner('m2', 2)"/>
                        <text id="m2_p2_text" x="10" y="68" font-size="12" font-weight="bold" pointer-events="none">選手4</text>
                        
                        <path id="m2_win_line" d="M 120 40 L 160 40 L 160 7.5 L 200 7.5" 
                              fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"
                              style="transition: stroke 0.4s, stroke-dashoffset 0.8s ease-in-out; stroke-dasharray: 200; stroke-dashoffset: 200;"/>
                    </g>

                    <g transform="translate(220, 75)">
                        <rect id="m3_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" />
                        <text id="m3_p1_text" x="10" y="23" font-size="10" fill="#9ca3af" pointer-events="none">m1の勝者</text>
                        
                        <rect id="m3_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" />
                        <text id="m3_p2_text" x="10" y="68" font-size="10" fill="#9ca3af" pointer-events="none">m2の勝者</text>
                    </g>
                </svg>
            </div>
            
            <button onclick="location.reload()" class="mt-4 text-xs text-gray-400 hover:underline">画面をリセット</button>
        </div>

    </div>

    <script>
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbzjvt0zhTjbKljLut6InqNAR769T_GWrqafZP0D8Y9y2nNH_kH6j81OY6NB8q0-AkaB9w/exec"
        };

        async function callGas(action, data) {
            const logElement = document.getElementById('responseLog');
            logElement.innerText = "GASへ送信中... (" + action + ")";
            try {
                const response = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify({ action, data }) });
                const result = await response.json();
                logElement.innerText = JSON.stringify(result, null, 2);
                return result; 
            } catch (error) {
                logElement.innerText = "通信エラー:\n" + error;
                return null;
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imagePreview');
                img.src = e.target.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function analyzeImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (!file) { alert('画像ファイルを選択してください。'); return; }

            const logElement = document.getElementById('responseLog');
            logElement.innerText = "画像をエンコード中...";

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64String = e.target.result.split(',')[1];
                const mimeType = file.type;

                const result = await callGas('ANALYZE_IMAGE', { base64: base64String, mimeType: mimeType });
                
                if (result && result.status === 'success' && result.data) {
                    updateTournamentUI(result.data);
                }
            };
            reader.readAsDataURL(file);
        }

        // --- ★修正版：JSONデータでUIを書き換える関数★ ---
        function updateTournamentUI(data) {
            // .textContent を使用してSVGのテキストを確実に書き換えます
            if (data.tournament_name) {
                document.getElementById('tourney_name').textContent = data.tournament_name;
            }

            if (data.matches && data.matches.length >= 2) {
                // m1 (第1試合)
                document.getElementById('m1_p1_text').textContent = data.matches[0].player1;
                document.getElementById('m1_p2_text').textContent = data.matches[0].player2;
                
                // m2 (第2試合)
                document.getElementById('m2_p1_text').textContent = data.matches[1].player1;
                document.getElementById('m2_p2_text').textContent = data.matches[1].player2;
            }

            alert("AI解析完了！デジタル・トーナメント表に反映しました。");
        }

        // --- ★拡張版：勝者を次の枠へ進めるアニメーション★ ---
        function markWinner(matchId, playerNum) {
            const line = document.getElementById(matchId + '_win_line');
            const box1 = document.getElementById(matchId + '_p1_box');
            const box2 = document.getElementById(matchId + '_p2_box');

            // 色のリセット
            [box1, box2].forEach(box => {
                box.setAttribute('fill', 'white');
                box.setAttribute('stroke', '#d1d5db');
            });

            // 選択した枠を赤くする
            const selectedBox = document.getElementById(matchId + '_p' + playerNum + '_box');
            selectedBox.setAttribute('fill', '#fef2f2');
            selectedBox.setAttribute('stroke', '#ef4444');

            // 線を伸ばす
            line.style.stroke = "#ef4444";
            line.style.strokeDashoffset = "0";

            // 勝者の名前を、次の試合（決勝: m3）の枠に自動入力する！
            const winnerName = document.getElementById(matchId + '_p' + playerNum + '_text').textContent;
            if (matchId === 'm1') {
                const m3p1 = document.getElementById('m3_p1_text');
                m3p1.textContent = winnerName;
                m3p1.setAttribute('fill', '#111827'); // 黒文字にして目立たせる
                m3p1.setAttribute('font-size', '12');
                m3p1.setAttribute('font-weight', 'bold');
            } else if (matchId === 'm2') {
                const m3p2 = document.getElementById('m3_p2_text');
                m3p2.textContent = winnerName;
                m3p2.setAttribute('fill', '#111827');
                m3p2.setAttribute('font-size', '12');
                m3p2.setAttribute('font-weight', 'bold');
            }

            if (window.navigator.vibrate) window.navigator.vibrate(15);
        }

        // 団体戦テスト用関数群（変更なし）
        function testSaveTournament() { callGas('SAVE_TOURNAMENT', { tournament_id: "T1", matches: [{ id: "M1", player1: "面田", player2: "小手山", next_match_id: "M3" }] }); }
        function testUpdateMatch() { callGas('UPDATE_MATCH', { id: "M1", score1: 2, score2: 0, winner_id: "面田" }); }
        function calculateTeamWinner(matches) {
            let teamA = { wins: 0, points: 0 }, teamB = { wins: 0, points: 0 };
            matches.forEach(m => {
                teamA.points += m.scoreA; teamB.points += m.scoreB;
                if (m.scoreA > m.scoreB) teamA.wins += 1;
                else if (m.scoreB > m.scoreA) teamB.wins += 1;
            });
            let result = "", needsDaihyo = false;
            if (teamA.wins > teamB.wins) result = "Team A 勝ち";
            else if (teamB.wins > teamA.wins) result = "Team B 勝ち";
            else {
                if (teamA.points > teamB.points) result = "Team A 本数勝ち";
                else if (teamB.points > teamA.points) result = "Team B 本数勝ち";
                else { result = "引き分け (代表戦)"; needsDaihyo = true; }
            }
            return { teamA, teamB, result, needsDaihyo };
        }
        function runLogicTest() {
            const summary = calculateTeamWinner([
                { pos: "先鋒", scoreA: 2, scoreB: 0 }, { pos: "次鋒", scoreA: 0, scoreB: 1 },
                { pos: "中堅", scoreA: 1, scoreB: 1 }, { pos: "副将", scoreA: 0, scoreB: 0 }, { pos: "大将", scoreA: 1, scoreB: 0 }
            ]);
            alert(`結果: ${summary.result}\nTeamA: ${summary.teamA.wins}勝(${summary.teamA.points}本)\nTeamB: ${summary.teamB.wins}勝(${summary.teamB.points}本)`);
        }
    </script>
</body>
</html>
