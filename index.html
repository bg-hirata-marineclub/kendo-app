<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KendoTournamentConnect - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 relative">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <details class="bg-white p-6 rounded-xl shadow-md cursor-pointer">
            <summary class="text-lg font-bold text-gray-800 outline-none">GAS API 連携テスト (開発用)</summary>
            <div class="space-y-4 mt-4 cursor-auto">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="testSaveTournament()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">1. 構造保存</button>
                    <button onclick="testUpdateMatch()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">2. 試合更新</button>
                </div>
                <div><pre id="responseLog" class="mt-2 p-4 bg-black text-green-400 rounded-md overflow-x-auto min-h-[60px] text-xs font-mono">待機中...</pre></div>
            </div>
        </details>

        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-500">
            <h2 class="text-xl font-bold mb-4 text-gray-800">4. トーナメント表のAI解析（Gemini）</h2>
            <div class="space-y-4">
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" onchange="previewImage(event)">
                <div id="imagePreviewContainer" class="hidden mt-4">
                    <img id="imagePreview" class="max-w-full h-auto rounded border border-gray-200" alt="プレビュー">
                </div>
                <button onclick="analyzeImage()" class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition text-sm font-bold shadow">
                    画像をGeminiで解析してUIに反映する
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-red-500 overflow-hidden">
            <h2 class="text-xl font-bold mb-2 text-gray-800">デジタル・トーナメント表</h2>
            <p id="tourney_name" class="text-sm font-bold text-red-600 mb-4">（未設定の大会）</p>
            <p class="text-xs text-gray-500 mb-4">試合の枠をタップすると、スコア入力画面が開きます。</p>
            
            <div class="bg-gray-50 p-4 rounded-lg overflow-x-auto border border-gray-200">
                <svg width="540" height="240" viewBox="0 0 540 240" class="mx-auto block min-w-[540px]">
                    <g transform="translate(20, 20)">
                        <rect id="m1_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m1')"/>
                        <text id="m1_p1_text" x="10" y="23" font-size="12" font-weight="bold" pointer-events="none">チームA</text>
                        <rect id="m1_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m1')"/>
                        <text id="m1_p2_text" x="10" y="68" font-size="12" font-weight="bold" pointer-events="none">チームB</text>
                        <path id="m1_win_line" d="M 120 40 L 160 40 L 160 72.5 L 200 72.5" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" style="transition: stroke 0.4s, stroke-dashoffset 0.8s ease-in-out; stroke-dasharray: 200; stroke-dashoffset: 200;"/>
                    </g>
                    <g transform="translate(20, 130)">
                        <rect id="m2_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m2')"/>
                        <text id="m2_p1_text" x="10" y="23" font-size="12" font-weight="bold" pointer-events="none">チームC</text>
                        <rect id="m2_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m2')"/>
                        <text id="m2_p2_text" x="10" y="68" font-size="12" font-weight="bold" pointer-events="none">チームD</text>
                        <path id="m2_win_line" d="M 120 40 L 160 40 L 160 7.5 L 200 7.5" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" style="transition: stroke 0.4s, stroke-dashoffset 0.8s ease-in-out; stroke-dasharray: 200; stroke-dashoffset: 200;"/>
                    </g>
                    <g transform="translate(220, 75)">
                        <rect id="m3_p1_box" x="0" y="0" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m3')"/>
                        <text id="m3_p1_text" x="10" y="23" font-size="10" fill="#9ca3af" pointer-events="none">m1の勝者</text>
                        <rect id="m3_p2_box" x="0" y="45" width="120" height="35" rx="5" fill="white" stroke="#d1d5db" stroke-width="2" class="cursor-pointer transition-colors" onclick="openScoreModal('m3')"/>
                        <text id="m3_p2_text" x="10" y="68" font-size="10" fill="#9ca3af" pointer-events="none">m2の勝者</text>
                        <path id="m3_win_line" d="M 120 40 L 180 40" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" style="transition: stroke 0.4s, stroke-dashoffset 0.6s ease-in-out; stroke-dasharray: 60; stroke-dashoffset: 60;"/>
                    </g>
                    <g transform="translate(400, 97)">
                        <text id="champion_label" x="0" y="-10" font-size="12" font-weight="bold" fill="#ef4444">優勝</text>
                        <rect id="champion_box" x="0" y="0" width="120" height="35" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" class="transition-all duration-500" />
                        <text id="champion_text" x="10" y="23" font-size="14" font-weight="bold" fill="#ef4444" pointer-events="none"></text>
                    </g>
                </svg>
            </div>
            <button onclick="location.reload()" class="mt-4 text-xs text-gray-400 hover:underline">画面をリセット</button>
        </div>
    </div>

    <div id="scoreModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 p-2 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden mt-10 mb-10">
            <div class="bg-gray-800 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-lg">試合記録</h3>
                <button onclick="closeScoreModal()" class="text-gray-300 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-2 sm:p-4">
                <div class="flex justify-between items-center font-bold text-lg mb-2 border-b-4 border-gray-200 pb-2">
                    <div id="modalTeam1" class="w-2/5 text-center text-red-600 truncate">赤チーム</div>
                    <div class="w-1/5 text-center text-sm text-gray-400">vs</div>
                    <div id="modalTeam2" class="w-2/5 text-center text-gray-800 truncate">白チーム</div>
                </div>

                <div id="kendoScoreBoard" class="space-y-3">
                    </div>

                <div class="mt-4 bg-yellow-50 p-2 rounded text-xs text-yellow-800 text-center font-bold border border-yellow-200 hidden" id="modalAlert">
                    </div>
            </div>

            <div class="bg-gray-100 p-3 flex justify-end space-x-3 border-t">
                <button onclick="closeScoreModal()" class="px-4 py-2 bg-white border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-200 transition">キャンセル</button>
                <button onclick="submitScore()" class="px-6 py-2 bg-red-600 text-white rounded font-bold shadow hover:bg-red-700 transition">判定して記録</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            GAS_URL: "https://script.google.com/macros/s/AKfycbzjvt0zhTjbKljLut6InqNAR769T_GWrqafZP0D8Y9y2nNH_kH6j81OY6NB8q0-AkaB9w/exec"
        };
        
        let currentEditingMatchId = null; 
        
        // ★剣道スコアの状態管理 (先鋒〜大将の5人分)
        const POSITIONS = ["先鋒", "次鋒", "中堅", "副将", "大将"];
        let matchState = []; 

        async function callGas(action, data) {
            const logElement = document.getElementById('responseLog');
            if(logElement) logElement.innerText = "GASへ送信中... (" + action + ")";
            try {
                const response = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify({ action, data }) });
                return await response.json();
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function analyzeImage() {
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files[0]) { alert('画像ファイルを選択してください。'); return; }
            document.getElementById('responseLog').innerText = "画像をエンコード中...";
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64String = e.target.result.split(',')[1];
                const result = await callGas('ANALYZE_IMAGE', { base64: base64String, mimeType: fileInput.files[0].type });
                if (result && result.status === 'success' && result.data) updateTournamentUI(result.data);
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function updateTournamentUI(data) {
            if (data.tournament_name) document.getElementById('tourney_name').textContent = data.tournament_name;
            if (data.matches && data.matches.length >= 2) {
                document.getElementById('m1_p1_text').textContent = data.matches[0].player1;
                document.getElementById('m1_p2_text').textContent = data.matches[0].player2;
                document.getElementById('m2_p1_text').textContent = data.matches[1].player1;
                document.getElementById('m2_p2_text').textContent = data.matches[1].player2;
            }
        }

        // ==========================================
        // ★新UI：剣道スコア入力ロジック★
        // ==========================================
        function openScoreModal(matchId) {
            const team1Text = document.getElementById(matchId + '_p1_text').textContent;
            const team2Text = document.getElementById(matchId + '_p2_text').textContent;

            if (team1Text.includes("の勝者") || team2Text.includes("の勝者")) {
                alert("対戦チームがまだ決まっていません。前の試合を先に完了させてください。");
                return;
            }

            currentEditingMatchId = matchId;
            document.getElementById('modalTeam1').textContent = team1Text;
            document.getElementById('modalTeam2').textContent = team2Text;
            document.getElementById('modalAlert').classList.add('hidden');

            // 5人分のスコア状態をリセット
            matchState = Array(5).fill(null).map(() => ({ marksA: [], marksB: [] }));
            
            renderScoreBoard();
            document.getElementById('scoreModal').classList.remove('hidden');
        }

        // スコアボードの描画（タップごとに呼ばれます）
        function renderScoreBoard() {
            const container = document.getElementById('kendoScoreBoard');
            container.innerHTML = '';

            POSITIONS.forEach((pos, idx) => {
                const state = matchState[idx];
                
                // 取得したマークのHTML生成（クリックで取り消し可能）
                const renderMarks = (marks, team) => {
                    return marks.map((m, i) => `
                        <span onclick="removeMark(${idx}, '${team}', ${i})" 
                              class="cursor-pointer inline-flex items-center justify-center w-6 h-6 rounded-full font-bold text-sm ${m === '▲' ? 'bg-yellow-200 text-yellow-800' : (team === 'A' ? 'bg-red-100 text-red-700' : 'bg-gray-200 text-gray-800')} shadow-sm border border-gray-300 mx-0.5 hover:opacity-70">
                            ${m}
                        </span>
                    `).join('');
                };

                // レゴブロックのようなUI
                const rowHtml = `
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-2 sm:p-3 relative shadow-sm">
                        <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md">
                            ${pos}
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            
                            <div class="w-5/12 flex flex-col items-center">
                                <div class="flex space-x-1 mb-2">
                                    <button onclick="addMark(${idx}, 'A', 'メ')" class="px-2 py-1 bg-red-50 hover:bg-red-200 border border-red-300 rounded text-xs font-bold text-red-700 transition">面</button>
                                    <button onclick="addMark(${idx}, 'A', 'コ')" class="px-2 py-1 bg-red-50 hover:bg-red-200 border border-red-300 rounded text-xs font-bold text-red-700 transition">小</button>
                                    <button onclick="addMark(${idx}, 'A', 'ド')" class="px-2 py-1 bg-red-50 hover:bg-red-200 border border-red-300 rounded text-xs font-bold text-red-700 transition">胴</button>
                                    <button onclick="addMark(${idx}, 'A', 'ツ')" class="px-2 py-1 bg-red-50 hover:bg-red-200 border border-red-300 rounded text-xs font-bold text-red-700 transition">突</button>
                                    <button onclick="addMark(${idx}, 'A', '▲')" class="px-1 py-1 bg-yellow-50 hover:bg-yellow-200 border border-yellow-300 rounded text-xs font-bold text-yellow-700 transition">反</button>
                                </div>
                                <div class="h-8 w-full bg-white border border-gray-300 rounded flex items-center justify-center shadow-inner">
                                    ${state.marksA.length > 0 ? renderMarks(state.marksA, 'A') : '<span class="text-gray-300 text-xs">タップで追加</span>'}
                                </div>
                            </div>

                            <div class="w-2/12 text-center text-gray-400 font-bold px-1 pb-1">-</div>

                            <div class="w-5/12 flex flex-col items-center">
                                <div class="flex space-x-1 mb-2">
                                    <button onclick="addMark(${idx}, 'B', 'メ')" class="px-2 py-1 bg-white hover:bg-gray-200 border border-gray-400 rounded text-xs font-bold text-gray-700 transition">面</button>
                                    <button onclick="addMark(${idx}, 'B', 'コ')" class="px-2 py-1 bg-white hover:bg-gray-200 border border-gray-400 rounded text-xs font-bold text-gray-700 transition">小</button>
                                    <button onclick="addMark(${idx}, 'B', 'ド')" class="px-2 py-1 bg-white hover:bg-gray-200 border border-gray-400 rounded text-xs font-bold text-gray-700 transition">胴</button>
                                    <button onclick="addMark(${idx}, 'B', 'ツ')" class="px-2 py-1 bg-white hover:bg-gray-200 border border-gray-400 rounded text-xs font-bold text-gray-700 transition">突</button>
                                    <button onclick="addMark(${idx}, 'B', '▲')" class="px-1 py-1 bg-yellow-50 hover:bg-yellow-200 border border-yellow-300 rounded text-xs font-bold text-yellow-700 transition">反</button>
                                </div>
                                <div class="h-8 w-full bg-white border border-gray-300 rounded flex items-center justify-center shadow-inner">
                                    ${state.marksB.length > 0 ? renderMarks(state.marksB, 'B') : '<span class="text-gray-300 text-xs">タップで追加</span>'}
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                container.innerHTML += rowHtml;
            });
        }

        // マークを追加（最大3つまで入るようにしていますが、実質2本勝負です）
        function addMark(posIdx, team, mark) {
            const marks = matchState[posIdx]['marks' + team];
            if (marks.length < 3) {
                marks.push(mark);
                if (window.navigator.vibrate) window.navigator.vibrate(10);
                renderScoreBoard();
            }
        }

        // マークを削除（間違えた時用）
        function removeMark(posIdx, team, markIdx) {
            matchState[posIdx]['marks' + team].splice(markIdx, 1);
            if (window.navigator.vibrate) window.navigator.vibrate(10);
            renderScoreBoard();
        }

        // ==========================================
        // ★勝敗判定とアニメーション（バグ修正済！）★
        // ==========================================
        function submitScore() {
            let teamA_wins = 0, teamA_points = 0;
            let teamB_wins = 0, teamB_points = 0;

            // 5人の勝敗を計算（剣道の公式ルール準拠！）
            matchState.forEach(m => {
                // 反則(▲)の数をカウント
                const foulsA = m.marksA.filter(x => x === '▲').length;
                const foulsB = m.marksB.filter(x => x === '▲').length;

                // 有効打突の数 ＋ 相手の反則2回につき1本
                let ptsA = m.marksA.filter(x => x !== '▲').length + Math.floor(foulsB / 2);
                let ptsB = m.marksB.filter(x => x !== '▲').length + Math.floor(foulsA / 2);

                // 2本先取なので最大2点に丸める
                if (ptsA > 2) ptsA = 2;
                if (ptsB > 2) ptsB = 2;

                teamA_points += ptsA;
                teamB_points += ptsB;

                if (ptsA > ptsB) teamA_wins++;
                else if (ptsB > ptsA) teamB_wins++;
            });

            // 勝敗を決める
            const needsDaihyo = (teamA_wins === teamB_wins && teamA_points === teamB_points);
            
            if (needsDaihyo) {
                const alertBox = document.getElementById('modalAlert');
                alertBox.textContent = "引き分けです！代表戦を行い、勝ったチームに本数を追加してください。";
                alertBox.classList.remove('hidden');
                if (window.navigator.vibrate) window.navigator.vibrate([100, 100]); 
                return; // ここで止める（モーダルは閉じない）
            }

            const winnerNum = (teamA_wins > teamB_wins || (teamA_wins === teamB_wins && teamA_points > teamB_points)) ? 1 : 2;

            // ★修正ポイント：閉じる前にIDを避難させておく！
            const savedMatchId = currentEditingMatchId; 
            
            closeScoreModal(); // これで currentEditingMatchId が null になります
            
            // 安全に避難させたIDを使ってアニメーションを呼ぶ
            markWinner(savedMatchId, winnerNum);
        }

        function closeScoreModal() {
            document.getElementById('scoreModal').classList.add('hidden');
            currentEditingMatchId = null;
        }

        function markWinner(matchId, playerNum) {
            const selectedText = document.getElementById(matchId + '_p' + playerNum + '_text').textContent;
            const line = document.getElementById(matchId + '_win_line');
            const box1 = document.getElementById(matchId + '_p1_box');
            const box2 = document.getElementById(matchId + '_p2_box');

            [box1, box2].forEach(box => { box.setAttribute('fill', 'white'); box.setAttribute('stroke', '#d1d5db'); });

            const selectedBox = document.getElementById(matchId + '_p' + playerNum + '_box');
            selectedBox.setAttribute('fill', '#fef2f2');
            selectedBox.setAttribute('stroke', '#ef4444');

            line.style.stroke = "#ef4444";
            line.style.strokeDashoffset = "0";

            if (matchId === 'm1') {
                const m3p1 = document.getElementById('m3_p1_text');
                m3p1.textContent = selectedText;
                m3p1.setAttribute('fill', '#111827'); 
                m3p1.setAttribute('font-size', '12'); m3p1.setAttribute('font-weight', 'bold');
            } else if (matchId === 'm2') {
                const m3p2 = document.getElementById('m3_p2_text');
                m3p2.textContent = selectedText;
                m3p2.setAttribute('fill', '#111827');
                m3p2.setAttribute('font-size', '12'); m3p2.setAttribute('font-weight', 'bold');
            } else if (matchId === 'm3') {
                const champText = document.getElementById('champion_text');
                const champBox = document.getElementById('champion_box');
                champText.textContent = selectedText;
                champBox.setAttribute('stroke-dasharray', '0'); 
                champBox.setAttribute('fill', '#fee2e2'); 
                if (window.navigator.vibrate) window.navigator.vibrate([30, 50, 30, 50, 100]);
            }
            if (matchId !== 'm3' && window.navigator.vibrate) window.navigator.vibrate(15);
        }

        function testSaveTournament() {}
        function testUpdateMatch() {}
    </script>
</body>
</html>
